services:
  web-e2e:
    build:
      context: .
      target: testing
    image: badges-system:${IMAGE_TAG:-latest}
    pull_policy: never
    environment:
      - ENV_FILE=.env.test
      - APP_ENV=test
      - DEBUG=False
      - E2E_BASE_URL=http://localhost:8009
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:?Ustaw POSTGRES_USER w .env}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Ustaw POSTGRES_PASSWORD w .env}
      - POSTGRES_DB=${POSTGRES_DB:?Ustaw POSTGRES_DB w .env}
      - CELERY_TASK_ALWAYS_EAGER=True
      - EMAIL_BACKEND=django.core.mail.backends.locmem.EmailBackend
      - GOOGLE_OAUTH_CLIENT_ID=mock-client-id
      - GOOGLE_OAUTH_CLIENT_SECRET=mock-client-secret
      - MAPY_CZ_API_KEY=mock-api-key
      - PLAYWRIGHT_LAUNCH_OPTIONS={"headless": true, "args": ["--no-sandbox", "--disable-setuid-sandbox"]}
    command: python manage.py runserver 0.0.0.0:8009
    ports:
      - "8009:8009"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
