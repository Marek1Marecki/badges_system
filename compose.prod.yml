# ==============================================================================
# compose.prod.yml — ŚRODOWISKO PROD
#
# Ten sam obraz `production` co PRE-PROD (Build Once, Deploy Many — ADR-020).
# Różnica względem PRE-PROD NIE ogranicza się do "prawdziwych danych" — PROD
# i PRE-PROD różnią się też WARSTWĄ INGRESS (PROD ma Caddy + porty 80/443
# zamknięte za proxy; PRE-PROD eksponuje 8000 bezpośrednio dla wygody testów
# E2E). Precyzyjniej: obraz aplikacji jest identyczny (Build Once), ale
# środowiska są "runtime-equivalent poza warstwą ingress", nie pełnym klonem
# 1:1 — to świadoma różnica, nie odstępstwo od ADR-020.
#
# WSZYSTKIE sekrety pochodzą ze zmiennych środowiska hosta / menedżera
# sekretów (Docker Secrets, AWS Parameter Store, itp.) — ADR-020, punkt 4.
# Plik .env.prod NIE powinien istnieć fizycznie na tym serwerze.
#
# Reference Data Release / Database Release / Application Release są
# uruchamiane jako oddzielne, jednorazowe zadania przez pipeline CI/CD
# (docker compose run --rm web ./scripts/release-*.sh), NIGDY automatycznie
# przy starcie tego kontenera.
#
# Warstwa wejściowa: `proxy` (Caddy) jest jedynym serwisem publikującym porty
# 80/443 na hosta. Gunicorn (`web`) NIE jest eksponowany bezpośrednio — tylko
# wewnątrz sieci Compose, pod nazwą usługi `web:8000` (patrz Caddyfile).
#
# ZMIENNE APLIKACYJNE — WERYFIKACJA WZGLĘDEM PRAWDZIWEGO .env.dev (nie
# zgadywane): patrz identyczne uzasadnienie na górze compose.preprod.yml —
# poprzednia wersja tego pliku błędnie zakładała `DJANGO_SECRET_KEY`
# (poprawnie: `SECRET_KEY`) i pomijała OAuth/Mapy.cz/OSM/logging/feature
# flags całkowicie.
# ==============================================================================

x-prod-app-env: &prod-app-env
  ENV_FILE: .env.prod
  APP_ENV: production
  DEBUG: "False"
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  POSTGRES_USER: ${POSTGRES_USER:?}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
  POSTGRES_DB: ${POSTGRES_DB:?}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0
  SECRET_KEY: ${SECRET_KEY:?}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:?}
  OVERPASS_API_URL: ${OVERPASS_API_URL:-https://overpass-api.de/api/interpreter}
  OVERPASS_TIMEOUT_SECONDS: ${OVERPASS_TIMEOUT_SECONDS:-40}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_JSON: ${LOG_JSON:-True}
  FEATURE_OSM_NIGHT_WATCHMAN: ${FEATURE_OSM_NIGHT_WATCHMAN:-True}
  FEATURE_PROXIMITY_SCAN: ${FEATURE_PROXIMITY_SCAN:-True}
  GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:?}
  GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:?}
  MAPY_CZ_API_KEY: ${MAPY_CZ_API_KEY:?}
  UV_CACHE_DIR: /tmp/.uv-cache  # Wymusza zapisy cache do zadeklarowanego wolumenu tmpfs, by nie uderzać w system read_only

services:
  db:
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}

  redis:
    # Brak `ports:`.

  proxy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME:?Ustaw DOMAIN_NAME w pliku .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - static_volume:/srv/staticfiles:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

  web:
    image: ${IMAGE_NAME:?}:${IMAGE_TAG:?}
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      <<: *prod-app-env
    volumes:
      - static_volume:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  celery_worker:
    image: ${IMAGE_NAME:?}:${IMAGE_TAG:?}
    restart: unless-stopped
    entrypoint: ["/app/scripts/entrypoint.sh"]
    command: ["celery", "-A", "config", "worker", "-l", "info"]
    environment:
      <<: *prod-app-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  celery_beat:
    image: ${IMAGE_NAME:?}:${IMAGE_TAG:?}
    restart: unless-stopped
    entrypoint: ["/app/scripts/entrypoint.sh"]
    command: ["celery", "-A", "config", "beat", "-l", "info"]
    environment:
      <<: *prod-app-env
    depends_on:
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

volumes:
  postgis_data:
    name: badges_system_prod_postgis_data
  redis_data:
    name: badges_system_prod_redis_data
  static_volume:
  caddy_data:
  caddy_config:
