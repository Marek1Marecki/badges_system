# ==============================================================================
# compose.preprod.yml — ŚRODOWISKO PRE-PROD (Staging / Walidacja Release Candidate)
#
# Zgodnie z ADR-020: ten sam, już zbudowany obraz `production` co PROD
# (Build Once, Deploy Many, ADR-020 pkt 5), ale z odciętą, syntetyczną bazą.
# Wyłącznie do testów E2E, `check --deploy` i symulacji wdrożeń. ZAKAZ
# ręcznych zmian danych referencyjnych i konfiguracji na tym środowisku
# (ADR-020, punkt 1).
#
# ⚠️  UWAGA — RYZYKO POMYŁKI Z PROD: ten plik CELOWO różni się od
# compose.prod.yml warstwą ingress — `web` publikuje port 8000 BEZPOŚREDNIO
# na hosta (bez Caddy/HTTPS), dla wygody szybkich testów E2E i debugowania.
# NIGDY nie kopiuj tego pliku jako punktu wyjścia dla PROD — użyj
# compose.prod.yml. Izolacja nazwy projektu (żeby `docker compose down`/`up`
# nie trafiły w DEV/PROD na tej samej maszynie) jest wymuszona przez
# `scripts/preprod-run.sh` — patrz szczegółowe uzasadnienie niżej. Nie
# wystarczy tu "rozważenie" ustawienia zmiennej ręcznie — bez tego skryptu
# domyślna nazwa projektu Compose koliduje z DEV, jeśli oba środowiska
# działają z tego samego katalogu repo.
#
# NA TEJ SAMEJ MASZYNIE CO DEV: UŻYWAJ WYŁĄCZNIE `scripts/preprod-run.sh`,
# NIGDY gołego `docker compose -f compose.yml -f compose.preprod.yml ...`.
# Powód: bez jawnej nazwy projektu, wywołanie z tego samego katalogu co DEV
# dostaje TĘ SAMĄ domyślną nazwę projektu (nazwę katalogu) — kontenery
# PRE-PROD nazywałyby się identycznie jak kontenery DEV (`badges_system-db-1`),
# co jest poważniejszym ryzykiem niż sama kolizja nazw wolumenów (naprawiona
# osobno, patrz sekcja `volumes:` niżej). `preprod-run.sh` wymusza osobną
# nazwę projektu (`badges_preprod`) jako zmienną powłoki — CELOWO NIE przez
# wpisanie `COMPOSE_PROJECT_NAME` do współdzielonego pliku `.env`, bo to
# zmieniłoby też domyślną nazwę projektu dla zwykłego `docker compose up`
# używanego przez DEV.
#
# CELOWO brak `build:` — PRE-PROD wyłącznie POBIERA gotowy obraz z rejestru
# (${IMAGE_NAME}:${IMAGE_TAG}). Obecność `build:` obok `image:` w tym samym
# serwisie sugerowałaby, że PRE-PROD mógłby zbudować własną, potencjalnie inną
# wersję obrazu niż ta faktycznie testowana — co unieważniłoby całą gwarancję
# "ten sam artefakt na PRE-PROD i PROD".
#
# ZMIENNE APLIKACYJNE — WERYFIKACJA WZGLĘDEM PRAWDZIWEGO .env.dev (nie
# zgadywane): nazwy poniżej (SECRET_KEY, CELERY_BROKER_URL/RESULT_BACKEND,
# GOOGLE_OAUTH_*, MAPY_CZ_API_KEY, OVERPASS_*, LOG_*, FEATURE_*) zostały
# zweryfikowane względem realnego pliku .env.dev projektu — poprzednia
# wersja tego pliku błędnie zakładała `DJANGO_SECRET_KEY` (poprawnie:
# `SECRET_KEY`) i pomijała całkowicie OAuth/Mapy.cz/OSM/logging/feature
# flags, co uciszyłoby te funkcje na PRE-PROD bez żadnego jawnego błędu.
#
# Sekrety (POSTGRES_PASSWORD, SECRET_KEY, GOOGLE_OAUTH_CLIENT_SECRET, itp.)
# pochodzą WYŁĄCZNIE ze zmiennych środowiskowych hosta / menedżera sekretów
# CI — nigdy z pliku na dysku (plik .env.preprod nie jest kopiowany do obrazu
# — patrz .dockerignore). ENV_FILE=.env.preprod pełni tu funkcję
# IDENTYFIKATORA PROFILU konfiguracji odczytywanego przez AppSettings, nie
# gwarancji fizycznej obecności pliku — w tym środowisku plik .env.preprod
# nie istnieje na dysku kontenera (env_file_required=False, patrz
# 20-configuration-contract.md).
#
# Użycie (przez preprod-run.sh — patrz uzasadnienie na górze pliku; obraz
# musi być wcześniej zbudowany i wypchnięty do rejestru w osobnym kroku CI):
#   ./scripts/preprod-run.sh run --rm web ./scripts/release-database.sh
#   ./scripts/preprod-run.sh run --rm web ./scripts/release-application.sh
#   ./scripts/preprod-run.sh up -d
# ==============================================================================

x-preprod-app-env: &preprod-app-env
  ENV_FILE: .env.preprod
  APP_ENV: preproduction
  DEBUG: "False"
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  POSTGRES_USER: ${POSTGRES_USER:?}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
  POSTGRES_DB: ${POSTGRES_DB:?}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  # Zweryfikowane względem .env.dev — AppSettings czyta CELERY_BROKER_URL
  # bezpośrednio, NIE oblicza go z REDIS_HOST/PORT (w odróżnieniu od
  # database_url, które faktycznie jest computed_field). "redis" tutaj to
  # nazwa usługi w sieci Compose — nie "localhost" jak w .env.dev (tamta
  # wartość jest poprawna tylko dla Redis wystawionego na hosta w DEV).
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0
  SECRET_KEY: ${SECRET_KEY:?}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:?}
  OVERPASS_API_URL: ${OVERPASS_API_URL:-https://overpass-api.de/api/interpreter}
  OVERPASS_TIMEOUT_SECONDS: ${OVERPASS_TIMEOUT_SECONDS:-40}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_JSON: ${LOG_JSON:-True}
  FEATURE_OSM_NIGHT_WATCHMAN: ${FEATURE_OSM_NIGHT_WATCHMAN:-True}
  FEATURE_PROXIMITY_SCAN: ${FEATURE_PROXIMITY_SCAN:-True}
  # Wymagane do działania logowania Google i integracji Mapy.cz — bez tych
  # zmiennych funkcje te cicho nie działałyby na PRE-PROD (poprzednia wersja
  # tego pliku ich w ogóle nie przekazywała).
  GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:?}
  GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:?}
  MAPY_CZ_API_KEY: ${MAPY_CZ_API_KEY:?}
  UV_CACHE_DIR: /tmp/.uv-cache  # Wymusza zapisy cache do zadeklarowanego wolumenu tmpfs, by nie uderzać w system read_only

services:
  db:
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    # Brak `ports:` — baza PRE-PROD nie jest eksponowana na host (Zasada
    # Izolacji Sieciowej, ADR-020, punkt 2).

  redis:
    # Brak `ports:` — jak wyżej.

  web:
    image: ${IMAGE_NAME:?}:${IMAGE_TAG:?}
    restart: unless-stopped
    # UWAGA: port publikowany BEZPOŚREDNIO na hosta — świadoma różnica
    # względem PROD (tam wyłącznie przez Caddy). Patrz ostrzeżenie na górze
    # pliku. Jeśli to środowisko ma być dostępne z zewnątrz (nie tylko przez
    # tunel/VPN), rozważcie dodanie własnej warstwy proxy przed tym portem.
    ports:
      - "8008:8000"
    environment:
      <<: *preprod-app-env
      # Wymagane WYŁĄCZNIE jeśli na tym środowisku uruchamiacie
      # `./scripts/bootstrap.sh` (pierwsza inicjalizacja PRE-PROD) — patrz
      # analogiczny komentarz w compose.override.yml.
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:?}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:?}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:?}
    volumes:
      # Wolumen zapisywalny mimo `read_only: true` na reszcie systemu plików —
      # `collectstatic` (release-application.sh) musi mieć gdzie pisać.
      - static_volume:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Brak `volumes:` z kodem hosta — obraz jest niemutowalny.

  celery_worker:
    image: ${IMAGE_NAME:?}:${IMAGE_TAG:?}
    restart: unless-stopped
    entrypoint: ["/app/scripts/entrypoint.sh"]
    command: ["celery", "-A", "config", "worker", "-l", "info"]
    environment:
      <<: *preprod-app-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  celery_beat:
    # BRAKOWAŁO tego serwisu w poprzedniej wersji pliku — PRE-PROD ma być
    # "runtime-equivalent poza warstwą ingress" względem PROD (różnica ma
    # dotyczyć WYŁĄCZNIE sieci/proxy, nie brakujących usług w runtime).
    # Bez Beat nigdy nie zweryfikowalibyście na PRE-PROD, czy harmonogram
    # zadań cyklicznych (np. FEATURE_OSM_NIGHT_WATCHMAN) działa poprawnie
    # w danym Release Candidate, zanim trafi na PROD.
    image: ${IMAGE_NAME:?}:${IMAGE_TAG:?}
    restart: unless-stopped
    entrypoint: ["/app/scripts/entrypoint.sh"]
    command: ["celery", "-A", "config", "beat", "-l", "info"]
    environment:
      <<: *preprod-app-env
    depends_on:
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  # KRYTYCZNE — bez tej sekcji PRE-PROD dziedziczyłby DOSŁOWNIE TE SAME
  # zahardkodowane nazwy wolumenów (`badges_system_postgis_data`/
  # `badges_system_redis_data`) co DEV (zdefiniowane w compose.yml, Runda 5).
  # To jest ta sama klasa błędu co incydent z compose.test.yml (Runda 9),
  # ale poważniejsza w skutkach: `release-database.sh` migruje bezpośrednio
  # skonfigurowaną `POSTGRES_DB`, bez przypadkowej ochrony jaką dawało
  # tworzenie osobnej bazy `test_*` przez pytest-django. Bez tej poprawki
  # PRE-PROD i DEV dzieliłyby dosłownie ten sam plik danych PostgreSQL —
  # przy jednoczesnym uruchomieniu obu środowisk ryzyko uszkodzenia klastra
  # (dwa procesy Postgres piszące do tego samego katalogu), a przy
  # sekwencyjnym — PRE-PROD faktycznie migrowałby/nadpisywał realną bazę DEV.
  #
  # Nazwa jest STAŁA (nie parametryzowana przez ${COMPOSE_PROJECT_NAME} jak
  # w compose.test.yml) — w odróżnieniu od TEST, PRE-PROD nie jest efemeryczne
  # per-uruchomienie, tylko relatywnie trwałe środowisko, więc stała,
  # jednoznaczna nazwa jest tu właściwsza niż parametryzowana.
  postgis_data:
    name: badges_system_preprod_postgis_data
  redis_data:
    name: badges_system_preprod_redis_data
  static_volume:
