[project]
name = "badges-system"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "celery>=5.6.3",
    "django>=6.0.3",
    "django-celery-beat>=2.9.0",
    "django-jsonform>=2.23.2",
    "django-leaflet>=0.33.0",
    "django-tinymce>=5.0.0",
    "pillow>=12.2.0",
    "psycopg>=3.3.3",
    "pydantic-settings>=2.13.1",
    "python-dateutil>=2.9.0.post0",
    "redis>=7.4.0",
    "loguru>=0.7.0",
    "django-unfold>=0.95.0",
    "beautifulsoup4>=4.15.0",
    "django-allauth>=65.18.0",
    "requests>=2.34.2",
    "pyjwt>=2.13.0",
    "cryptography>=49.0.0",
    "defusedxml>=0.7.1",
    "pyvis>=0.3.2",
    "dj-database-url>=3.1.2",
    "gunicorn>=26.0.0",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "import-linter>=2.11",
    "mypy>=1.19.1",
    "playwright>=1.62.0",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.12.0",
    "pytest-playwright>=0.8.0",
    "ruff>=0.15.8",
    "types-python-dateutil>=2.9.0.20260408",
]

[tool.pytest.ini_options]
# To jest informacja dla pytest-django:
DJANGO_SETTINGS_MODULE = "config.settings"
# Pozwala wtyczce pytest-django rozpoznać, że używamy jej do uruchomienia bazy danych
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests"]
markers = [
    "integration: testy dotykające bazy danych lub zewnętrznych API",
]
addopts = ["--strict-markers", "--cov=.", "--cov-fail-under=80"]
filterwarnings = [
    "ignore:DateTimeField .* received a naive datetime:RuntimeWarning",
]

[tool.mypy]
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
warn_return_any = true
ignore_missing_imports = true
exclude = ["migrations"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

[[tool.mypy.overrides]]
module = ["infrastructure.*", "apps.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["django.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "D", "S", "UP", "TID"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["D", "S101"]
"**/domain/**" = ["S101"]
"**/migrations/**" = ["D", "E501"]
"**/admin.py" = ["D"]
"infrastructure/**" = ["D"] # tymczasowo, do czasu pełnego wdrożenia
"apps/**" = ["D"]
"scripts/**" = ["D", "E501"]
"bootstrap/**" = ["D"]

# Banned API (Contract 14 & 17)
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"datetime.datetime.now" = { msg = "Use injected ClockPort instead of datetime.now()." }

[tool.audit]
domain_paths = ["domain"]
application_paths = ["application"]
bootstrap_paths = ["bootstrap"]
