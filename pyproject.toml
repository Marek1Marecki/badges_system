[project]
name = "badges-system"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "celery>=5.6.3",
    "django>=6.0.4",
    "sqlparse>=0.6.0",
    "django-celery-beat>=2.9.0",
    "django-jsonform>=2.23.2",
    "django-leaflet>=0.33.0",
    "django-tinymce>=5.0.0",
    "pillow>=12.3.0",
    "psycopg>=3.3.4",
    "pydantic-settings>=2.15.0",
    "python-dateutil>=2.9.0.post0",
    "redis>=8.1.0",
    "loguru>=0.7.0",
    "django-unfold>=0.102.0",
    "beautifulsoup4>=4.15.0",
    "django-allauth>=65.18.0",
    "requests>=2.34.2",
    "pyjwt>=2.13.0",
    "cryptography>=50.0.0",
    "defusedxml>=0.7.1",
    "dj-database-url>=3.1.2",
    "gunicorn>=26.0.0",
    "whitenoise>=6.12.0",
]

[dependency-groups]
test = [
    "hypothesis>=6.116.0",
    "playwright>=1.62.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.12.0",
]
dev = [
    "graphviz>=0.20",
    "hypothesis>=6.116.0",
    "import-linter>=2.13",
    "mypy>=2.3.0",
    "playwright>=1.62.0",
    "pre-commit>=4.6.1",
    "pydeps>=1.12",
    "pylint>=3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.12.0",
    "pytest-playwright>=0.8.0",
    "pytest-randomly>=3.15",
    "ruff>=0.16.3",
    "types-python-dateutil>=2.9.0.20260716",
    "pyvis>=0.3.2",
    "semgrep>=1.172.0",
    "radon>=6.0.1",
    "xenon>=0.9.3",
    "wily>=1.12.2",
    "pdoc>=15.0",
    "docformatter>=1.7.8",
    "pyment>=0.3.3",
    "diff-cover>=9.2",
    "detect-secrets>=1.5",
    "pytest-html>=4.2.0",
    "docstr-coverage>=2.3.2",
    "djlint>=1.44.2",
]

[tool.pytest.ini_options]
# To jest informacja dla pytest-django:
DJANGO_SETTINGS_MODULE = "config.settings"
# Pozwala wtyczce pytest-django rozpoznać, że używamy jej do uruchomienia bazy danych
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests"]
# Twarde przypisanie dozwolonych markerów w projekcie:
markers = [
    "integration: Oznacza testy wymagajace dzialajacej bazy danych PostGIS (deselekcjonowane przez 'not integration')",
    "e2e: Oznacza testy End-to-End przegladarkowe (Playwright)",
]
addopts = ["--strict-markers", "--cov=.", "--cov-fail-under=80"]
filterwarnings = [
    "ignore:DateTimeField .* received a naive datetime:RuntimeWarning",
]

[tool.mypy]
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
warn_return_any = true
ignore_missing_imports = true
exclude = ["migrations"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

[[tool.mypy.overrides]]
module = ["infrastructure.*", "apps.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["django.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "D", "S", "UP", "TID"]
ignore = ["D214", "D411", "D414"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["D", "S101"]
"**/domain/**" = ["S101"]
"**/migrations/**" = ["D", "E501"]
"**/infrastructure/**" = ["D"] # tymczasowo, do czasu pełnego wdrożenia
"**/apps/**" = ["D"]
"**/admin.py" = ["D"]
"scripts/**" = ["D", "E501"]
"bootstrap/**" = ["D"]

# Banned API (Contract 14 & 17)
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"datetime.datetime.now" = { msg = "Use injected ClockPort instead of datetime.now()." }

[tool.audit]
domain_paths = ["domain"]
application_paths = ["application"]
bootstrap_paths = ["bootstrap"]

[tool.docformatter]
wrap-summaries = 120
wrap-descriptions = 120
style = "sphinx"
non-cap = ["django", "celery", "redis", "postgis", "uv", "api", "c4", "dto", "url", "id", "uuid"]

[tool.uv]
constraint-dependencies = [
    "sqlparse>=0.6.0",
]
