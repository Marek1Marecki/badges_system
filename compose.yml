# ==============================================================================
# compose.yml — WSPÓLNA BAZA dla wszystkich środowisk (DEV/TEST/PRE-PROD/PROD)
#
# Zgodnie z ADR-020: Docker nie zna konfiguracji Django (DEBUG, SECRET_KEY,
# LOG_LEVEL...) — to wyłącznie domena AppSettings/Pydantic. Ten plik zna
# jedynie to, czego wymagają same obrazy bazy danych i cache (POSTGRES_*),
# bo są to procesy spoza Django, nieświadome istnienia Pydantic.
#
# Zmienne POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB pochodzą z pliku
# `.env` w katalogu głównym (auto-ładowany przez Docker Compose) — jest to
# PLIK COMPOSE, odrębny od plików .env.dev/.env.test/.env.preprod/.env.prod
# czytanych przez Pydantic wewnątrz kontenera web/celery.
#
# Ten plik NIGDY nie definiuje portów ani wolumenów aplikacyjnych specyficznych
# dla środowiska — to rola compose.override.yml / compose.test.yml /
# compose.preprod.yml / compose.prod.yml.
# ==============================================================================

services:
  db:
    restart: unless-stopped
    # PostgreSQL 18 (przez PostGIS) — WAŻNE: patrz ADR-025 (PostgreSQL Volume
    # Layout). Wersja i ścieżka montowania wolumenu NIE są tu niezależnymi
    # decyzjami — od PG 18 oficjalny obraz zmienił domyślny PGDATA na
    # /var/lib/postgresql/<major>/docker (osobny podkatalog per wersja), co
    # wymaga montowania RODZICA (/var/lib/postgresql), nie konkretnej ścieżki
    # danych — inaczej `pg_upgrade --link` między wersjami nie zadziała, a przy
    # niedopasowaniu wolumenu do wersji obrazu Postgres tworzy nową, PUSTĄ
    # bazę zamiast rozpoznać istniejące dane (to dokładnie tak stracono dane
    # w tym projekcie — patrz ADR-025, Kontekst).
    image: postgis/postgis:18-3.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Ustaw POSTGRES_USER w pliku .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ustaw POSTGRES_PASSWORD w pliku .env}
      POSTGRES_DB: ${POSTGRES_DB:?Ustaw POSTGRES_DB w pliku .env}
    volumes:
      # RODZIC katalogu danych, NIE konkretna wersja/podkatalog. Poprawne dla
      # PG 18+. Migrujący z wcześniejszej wersji tego pliku (PG 15,
      # `/var/lib/postgresql/data`) — patrz ADR-025 sekcja "Migracja
      # istniejącego wolumenu" PRZED zmianą tej linii na środowisku z danymi.
      - postgis_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    # Wersja przypięta (nie ruchomy tag `7-alpine`) — zgodnie z Build Once,
    # Deploy Many (ADR-020, pkt 5) i polityką tagowania obrazów bazowych.
    image: redis:7.4-alpine
    restart: unless-stopped
    # --maxmemory + --maxmemory-policy: bez limitu Redis (broker Celery i
    # ewentualny cache) mógłby przy wzroście ruchu konkurować o RAM z
    # PostgreSQL na tym samym hoście. `noeviction` jest bezpieczniejsze niż
    # domyślne polityki usuwające klucze — wolimy jawny błąd zapisu (Celery
    # obsłuży retry) niż ciche utracenie zadania/wpisu z powodu eviction.
    # Wartość progu nadpisywalna przez zmienną środowiskową per środowisko.
    command: >
      redis-server
      --appendonly yes
      --maxmemory ${REDIS_MAXMEMORY:-256mb}
      --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  # Jawna nazwa (`name:`) — niezależna od nazwy projektu Compose
  # (COMPOSE_PROJECT_NAME / -p / nazwa katalogu). Bez tego uruchomienie
  # `docker compose` z inną nazwą projektu tworzy NOWY, pusty wolumen o innej
  # nazwie wygenerowanej automatycznie (`<projekt>_postgis_data`), zamiast
  # podpiąć się pod istniejące dane — ta sama klasa ryzyka co niedopasowanie
  # PGDATA opisane w ADR-025, tylko na poziomie tożsamości wolumenu, nie
  # ścieżki wewnątrz niego.
  #
  # PRZED ZMIANĄ TEJ NAZWY na istniejącym środowisku z danymi: sprawdź
  # `docker volume ls`, czy nazwa poniżej zgadza się z już istniejącym
  # wolumenem. Jeśli nie — to NIE jest bezpieczna zmiana "w locie": zrób
  # `./scripts/dev-backup.sh` najpierw (patrz ADR-025, ta sama zasada
  # co przy zmianie wersji obrazu Postgresa).
  postgis_data:
    name: badges_system_postgis_data
  redis_data:
    name: badges_system_redis_data
