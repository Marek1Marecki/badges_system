# ==============================================================================
# compose.test.yml — ŚRODOWISKO TEST (Efemeryczne CI)
#
# Zgodnie z ADR-020: TEST nie utrzymuje trwałego stanu między uruchomieniami.
# Efemeryczność jest zapewniona przez CYKL ŻYCIA (unikalna nazwa projektu +
# `down -v` po zakończeniu), a nie przez tmpfs — dzięki temu plik nie zależy
# od zaawansowanych tagów scalania Compose (`!reset`/`!override`, wymagających
# Docker Compose >= 2.24) i pozostaje przenośny między wersjami CI runnerów.
#
# Obraz `testing` ma kod ZAMROŻONY (COPY . wykonane przy buildzie) — brak
# wolumenu z hosta. Plik .env.test jest wykluczony przez .dockerignore, więc
# realne wartości muszą być wstrzyknięte tutaj, jawnie, przez `environment:`
# (zgodnie z env_file_required=False w AppSettings — fallback na os.environ).
#
# Użycie (obowiązkowo z unikalną nazwą projektu i pełnym sprzątaniem po sobie):
#   docker compose -p ci-${CI_RUN_ID} -f compose.yml -f compose.test.yml \
#       up -d --wait db redis
#   docker compose -p ci-${CI_RUN_ID} -f compose.yml -f compose.test.yml \
#       run --rm web
#   docker compose -p ci-${CI_RUN_ID} -f compose.yml -f compose.test.yml \
#       down -v --remove-orphans
# ==============================================================================

services:
  db:
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Ustaw POSTGRES_USER w .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ustaw POSTGRES_PASSWORD w .env}
      POSTGRES_DB: ${POSTGRES_DB:?Ustaw POSTGRES_DB w .env}
    # Brak `ports:` — baza TEST nie jest eksponowana na host.

  redis:
    command: ["redis-server"]
    # Brak `ports:` — jak wyżej.

  web:
    # UWAGA — realny incydent w tym projekcie: bez jawnej, unikalnej nazwy
    # `image:` Compose domyślnie taguje obraz jako `<nazwa_projektu>-web`.
    # Jeśli ten plik zostanie kiedykolwiek uruchomiony BEZ `-p ci-...`
    # (dokumentacja niżej to zaleca, ale nic wcześniej tego technicznie nie
    # wymuszało), tag `<projekt>-web` pokrywa się z tagiem obrazu z
    # `compose.override.yml` (target: development) — budowa tego pliku
    # PO CICHU NADPISUJE obraz deweloperski obrazem testowym (inny ENTRYPOINT:
    # `uv run pytest` zamiast `runserver`/braku entrypointu). Efekt: kolejne
    # `docker compose run --rm web <cokolwiek>` w DEV podaje ten argument
    # jako ścieżkę do pytest zamiast wykonać go jako polecenie. Jawna,
    # zawsze-inna nazwa poniżej eliminuje to ryzyko strukturalnie — nawet
    # przy zapomnianym `-p`, obrazy nigdy nie dzielą tagu.
    image: badges_system-web-testing
    # `pull_policy: build` — bez tego Compose najpierw PRÓBUJE pociągnąć ten
    # tag z rejestru (którego nie ma — stąd myląca linia "pull access denied"
    # w logu), dopiero potem buduje lokalnie. Funkcjonalnie nieszkodliwe
    # (build i tak następuje), ale zbędnie niepokojące w logach CI.
    pull_policy: build
    build:
      context: .
      target: testing
    environment:
      - ENV_FILE=.env.test
      - APP_ENV=test
      - DEBUG=False
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:?Ustaw POSTGRES_USER w .env}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Ustaw POSTGRES_PASSWORD w .env}
      - POSTGRES_DB=${POSTGRES_DB:?Ustaw POSTGRES_DB w .env}
      - CELERY_TASK_ALWAYS_EAGER=True
      - EMAIL_BACKEND=django.core.mail.backends.locmem.EmailBackend
      - GOOGLE_OAUTH_CLIENT_ID=mock-client-id
      - GOOGLE_OAUTH_CLIENT_SECRET=mock-client-secret
      - MAPY_CZ_API_KEY=mock-api-key
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Brak `volumes:` z kodem hosta — kod jest zamrożony w obrazie 'testing'.

# KRYTYCZNE — bez tej sekcji TEST dziedziczyłby SZTYWNE nazwy wolumenów
# (`badges_system_postgis_data`/`badges_system_redis_data`) zadeklarowane
# w compose.yml (ADR-025/Runda 5), bo compose.test.yml ładuje ten plik jako
# bazę (`-f compose.yml -f compose.test.yml`). Efekt uboczny bez tej
# poprawki: TEST próbuje podłączyć się do TYCH SAMYCH wolumenów co DEV,
# niezależnie od `-p` — nazwa wolumenu w Dockerze nie podlega namespace'owaniu
# po projekcie, jeśli `name:` jest ustawione na sztywno. `${COMPOSE_PROJECT_NAME}`
# rozwiązuje się do wartości podanej przez `-p` w tym samym uruchomieniu
# Compose, więc każdy przebieg TEST dostaje własne, unikalne wolumeny,
# nigdy nie kolidujące z `badges_system_*` używanym przez DEV/PROD.
volumes:
  # Przyrostek `_test` jest DODATKOWYM zabezpieczeniem (obrona w głąb) —
  # nawet gdyby ktoś uruchomił ten plik bezpośrednio, z pominięciem
  # scripts/test-run.sh i bez flagi `-p` (Compose domyślnie użyłby wtedy
  # nazwy katalogu jako projektu, czyli prawdopodobnie "badges_system" —
  # dokładnie tej samej, której używa DEV), wynikowa nazwa wolumenu
  # (`badges_system_test_postgis_data`) i tak NIGDY nie zbiegnie się z
  # nazwą używaną przez DEV (`badges_system_postgis_data`, bez "_test").
  postgis_data:
    name: ${COMPOSE_PROJECT_NAME}_test_postgis_data
  redis_data:
    name: ${COMPOSE_PROJECT_NAME}_test_redis_data