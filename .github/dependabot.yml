version: 2

updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Europe/Warsaw"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    reviewers:
      - "Marek1Marecki"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    allow:
      - dependency-type: "all"
    ignore:
      - dependency-name: "*"
        update-type: "major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Europe/Warsaw"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    reviewers:
      - "Marek1Marecki"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    allow:
      - dependency-type: "all"
    # AUDYT-154: CodeQL `init` i `analyze` muszą mieć IDENTYCZNY SHA.
    # Dependabot otwiera osobne PR-y → asynchroniczny bump → version mismatch.
    # Wyłączamy automat i ręcznie podnosimy oba SHA jednocześnie.
    ignore:
      - dependency-name: "github/codeql-action"
        update-type: "all"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Europe/Warsaw"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    reviewers:
      - "Marek1Marecki"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    allow:
      - dependency-type: "all"
