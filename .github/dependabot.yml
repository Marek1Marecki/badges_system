version: 2

updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Europe/Warsaw"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    reviewers:
      - "Marek1Marecki"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    allow:
      - dependency-type: "all"
    ignore:
      - dependency-name: "*"
        update-type: "major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Europe/Warsaw"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    reviewers:
      - "Marek1Marecki"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    allow:
      - dependency-type: "all"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Europe/Warsaw"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    reviewers:
      - "Marek1Marecki"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    allow:
      - dependency-type: "all"
