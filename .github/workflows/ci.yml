name: CI Pipeline

on:
  push:
    branches:
      - main
    # Optymalizacja kosztów chmury: Nie uruchamiamy CI, gdy edytujesz tylko dokumentację Markdown w docs/
    paths:
      - '**.py'
      - '**.sh'
      - '**.html'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.env.example'
      - '.github/workflows/**'
      - 'Makefile*'
      - '.importlinter'
  pull_request:
    branches:
      - main
    paths:
      - '**.py'
      - '**.sh'
      - '**.html'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.env.example'
      - '.github/workflows/**'
      - 'Makefile*'
      - '.importlinter'

jobs:
  static-analysis-and-unit-tests:
    name: Code Quality & Unit Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Pobieranie repozytorium
        uses: actions/checkout@v4

      - name: Instalacja zależności systemowych (GDAL, GEOS, PROJ)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gdal-bin \
            libgdal-dev \
            libgeos-dev \
            libproj-dev

      - name: Konfiguracja narzędzia UV
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.11"
          enable-cache: true

      - name: Konfiguracja Pythona 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Instalacja zależności (z grupy DEV)
        run: uv sync --frozen --group dev --python 3.14

      - name: Weryfikacja formatowania kodu (Ruff Format)
        run: uv run ruff format --check domain application infrastructure apps bootstrap scripts

      - name: Uruchomienie Linterów Kodowych (Ruff Check)
        run: uv run ruff check domain application infrastructure apps bootstrap scripts

      - name: Weryfikacja Typów (Mypy)
        run: uv run mypy domain application infrastructure apps bootstrap scripts

      - name: Weryfikacja Kontraktów Czystej Architektury (Import Linter)
        run: uv run lint-imports

      - name: Audyt SRE (Ochrona przed wyciekami i zakazanym API)
        run: uv run python scripts/audit_contracts.py

      - name: Generowanie kluczy na potrzeby testów z bazy w pamięci (Pydantic Bypass)
        run: |
          cp .env.example .env
          echo "DJANGO_SECRET_KEY=$(openssl rand -hex 32)" > .env.test
          echo "DJANGO_DEBUG=False" >> .env.test
          echo "LOG_LEVEL=DEBUG" >> .env.test

      - name: Testy Jednostkowe (Unit Tests)
        # Dodano generowanie fizycznych raportów dla zespołu i debugowania
        run: ENV_FILE=.env.test uv run pytest tests -m "not integration and not e2e" --junitxml=unit-test-results.xml

      - name: Zapisz raporty z testów do archiwum Github Actions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: unit-test-results.xml
          retention-days: 7

  integration-tests:
    name: Infrastructure & Integration Tests
    needs: static-analysis-and-unit-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Pobieranie repozytorium
        uses: actions/checkout@v4

      - name: Instalacja zależności systemowych (GDAL, GEOS, PROJ)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gdal-bin \
            libgdal-dev \
            libgeos-dev \
            libproj-dev

      - name: Konfiguracja narzędzia UV (dla celów zapytań CI)
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.11"
          enable-cache: true

      - name: Konfiguracja Pythona 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Instalacja zależności (z grupy DEV)
        run: uv sync --frozen --group dev --python 3.14

      - name: Generowanie testowych środowisk i kluczy asymetrycznych
        # Generowanie super-bezpiecznego, kryptograficznego klucza bez naruszania logów w Gicie
        run: |
          cp .env.example .env
          echo "DEV_UID=1000" >> .env
          echo "DEV_GID=1000" >> .env
          echo "POSTGRES_USER=test_user" >> .env
          echo "POSTGRES_PASSWORD=test_password" >> .env
          echo "DJANGO_SECRET_KEY=tajny_klucz_do_testow_ci" > .env.test
          echo "DJANGO_DEBUG=False" >> .env.test
          echo "LOG_LEVEL=DEBUG" >> .env.test

      - name: Budowanie obrazów Dockera
        run: docker compose -f compose.yml -f compose.test.yml build --no-cache --pull=false web

      - name: Sprawdź skrypty w obrazie testowym
        run: docker compose -f compose.yml -f compose.test.yml run --rm web ls -la /app/scripts/

      - name: Cache dla obrazów Dockera (Optymalizacja czasu budowy)
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Próba Generalna Środowiska (test-run.sh --full)
        run: ./scripts/test-run.sh --full -m "not e2e"

      - name: Zapisanie logów Dockera (zawsze)
        if: always()
        run: docker compose -f compose.yml -f compose.test.yml logs > integration-test-docker-logs.txt || true

      - name: Upload logów Dockera jako artefakt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-docker-logs
          path: integration-test-docker-logs.txt
