name: CI Pipeline

on:
  push:
    branches:
      - main
    # Optymalizacja kosztów chmury: Nie uruchamiamy CI, gdy edytujesz tylko
    # pliki niebędące częścią buildu/testów. Dokumentacja w docs/ oraz
    # konfiguracja Docker/compose są teraz częścią triggera.
    paths:
      - '**.py'
      - '**.sh'
      - '**.html'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.env.example'
      - '.github/workflows/**'
      - 'Makefile*'
      - '.importlinter'
      - 'Dockerfile'
      - 'compose*.yml'
      - 'docs/**'
  pull_request:
    branches:
      - main
    paths:
      - '**.py'
      - '**.sh'
      - '**.html'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.env.example'
      - '.github/workflows/**'
      - 'Makefile*'
      - '.importlinter'
      - 'Dockerfile'
      - 'compose*.yml'
      - 'docs/**'

jobs:
  static-analysis-and-unit-tests:
    name: Code Quality & Unit Tests
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Pobieranie repozytorium
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Instalacja zależności systemowych (GDAL, GEOS, PROJ, Graphviz)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gdal-bin \
            libgdal-dev \
            libgeos-dev \
            libproj-dev \
            graphviz

      - name: Konfiguracja narzędzia UV
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.5.11"
          enable-cache: true

      - name: Konfiguracja Pythona 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"

      - name: Instalacja zależności (z grupy DEV)
        run: uv sync --frozen --group dev --python 3.14
      - name: Weryfikacja formatowania kodu (Ruff Format)
        run: uv run ruff format --check domain application infrastructure apps bootstrap scripts

      - name: Uruchomienie Linterów Kodowych (Ruff Check)
        run: uv run ruff check domain application infrastructure apps bootstrap scripts

      - name: Weryfikacja Typów (Mypy)
        run: uv run mypy domain application infrastructure apps bootstrap scripts

      - name: Weryfikacja Kontraktów Czystej Architektury (Import Linter)
        run: uv run lint-imports

      - name: Skanowanie Bezpieczeństwa Kodu (SAST / Semgrep)
        run: make security-audit

      - name: Audyt SRE (Ochrona przed wyciekami i zakazanym API)
        run: uv run python scripts/audit_contracts.py

      - name: Generowanie diagramów architektury (pydeps + pyreverse)
        run: make graph-modules graph-classes

      - name: Upload diagramów architektury
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: architecture-diagrams
          path: |
            docs/architecture/
            dependencies-pydeps.svg
          retention-days: 30

      - name: Generowanie kluczy na potrzeby testów z bazy w pamięci (Pydantic Bypass)
        run: |
          cp .env.example .env
          echo "DJANGO_SECRET_KEY=$(openssl rand -hex 32)" > .env.test
          echo "DJANGO_DEBUG=False" >> .env.test
          echo "LOG_LEVEL=DEBUG" >> .env.test

      - name: Testy Jednostkowe (Unit Tests)
        # Dodano generowanie fizycznych raportów dla zespołu i debugowania
        run: ENV_FILE=.env.test uv run pytest tests -m "not integration and not e2e" --junitxml=unit-test-results.xml

      - name: Zapisz raporty z testów do archiwum Github Actions
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: unit-test-results
          path: unit-test-results.xml
          retention-days: 7

  integration-tests:
    name: Infrastructure, Trivy & Integration Tests
    needs: static-analysis-and-unit-tests
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: badges_system_test
      TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db
    steps:
      - name: Pobieranie repozytorium
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Instalacja zależności systemowych (GDAL, GEOS, PROJ)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gdal-bin \
            libgdal-dev \
            libgeos-dev \
            libproj-dev

      - name: Konfiguracja narzędzia UV (dla celów zapytań CI)
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.3"
          enable-cache: true

      - name: Konfiguracja Pythona 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"

      - name: Instalacja zależności (z grupy DEV)
        run: uv sync --frozen --group dev --python 3.14

      - name: Generowanie testowych środowisk i kluczy asymetrycznych
        # Generowanie super-bezpiecznego, kryptograficznego klucza bez naruszania logów w Gicie
        run: |
          cp .env.example .env
          echo "DEV_UID=1000" >> .env
          echo "DEV_GID=1000" >> .env
          echo "POSTGRES_USER=postgres" >> .env
          echo "POSTGRES_PASSWORD=password" >> .env
          echo "POSTGRES_HOST=db" >> .env
          echo "IMAGE_NAME=badges-system" >> .env
          echo "IMAGE_TAG=${{ github.sha }}" >> .env
          echo "DJANGO_SECRET_KEY=tajny_klucz_do_testow_ci" > .env.test
          echo "DJANGO_DEBUG=False" >> .env.test
          echo "POSTGRES_HOST=db" >> .env.test
          echo "LOG_LEVEL=DEBUG" >> .env.test

      - name: Budowanie obrazu produkcyjnego (Build Once)
        run: docker build --target production -t badges-system:${{ github.sha }} .

      - name: Skanowanie obrazu produkcyjnego w poszukiwaniu luk CVE (Trivy) — development mode
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy":/root/.cache/trivy \
            -v "$(pwd)":/work -w /work \
            aquasec/trivy:0.58.0 \
            image \
            --db-repository public.ecr.aws/aquasecurity/trivy-db \
            --severity HIGH,CRITICAL \
            --scanners vuln \
            --format json \
            --output /work/trivy-report.json \
            --ignore-unfixed \
            badges-system:${{ github.sha }}

      - name: Klasyfikacja CVE — security backlog (development)
        if: always()
        run: |
          if [ ! -f trivy-report.json ]; then
            echo "⚠️  Brak raportu Trivy (prawdopodobnie skan nie został wykonany)"
            exit 0
          fi
          echo "=== TRIVY REPORT: CVE CLASSIFICATION ==="
          CRITICAL_AFFECTED=$(python3 -c "
          import json
          with open('trivy-report.json') as f:
            data = json.load(f)
          vulns = [v for r in data.get('Results', []) for v in r.get('Vulnerabilities', []) if v.get('Severity') == 'CRITICAL' and v.get('FixedVersion')]
          print(len(vulns))
          " 2>/dev/null || echo "0")
          HIGH_AFFECTED=$(python3 -c "
          import json
          with open('trivy-report.json') as f:
            data = json.load(f)
          vulns = [v for r in data.get('Results', []) for v in r.get('Vulnerabilities', []) if v.get('Severity') == 'HIGH' and v.get('FixedVersion')]
          print(len(vulns))
          " 2>/dev/null || echo "0")
          echo "CRITICAL + affected (fix available): ${CRITICAL_AFFECTED}"
          echo "HIGH + affected (fix available): ${HIGH_AFFECTED}"
          echo ""
          echo "Top affected packages (fix available):"
          python3 -c "
          import json
          from collections import Counter
          with open('trivy-report.json') as f:
            data = json.load(f)
          vulns = [v for r in data.get('Results', []) for v in r.get('Vulnerabilities', []) if v.get('Severity') in ('CRITICAL', 'HIGH') and v.get('FixedVersion')]
          c = Counter(v.get('PkgName', 'unknown') for v in vulns)
          for pkg, count in c.most_common(10):
            print(f'  {count} - {pkg}')
          " 2>/dev/null || echo "  (nie udało się wygenerować podsumowania)"
          echo ""
          echo "NOTE: CVE z statusem 'will_not_fix' lub 'fix_deferred' są pomijane w development mode."
          echo "      Zostaną sklasyfikowane w security gate policy przed PROD."

      - name: Upload raportu Trivy jako artefakt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: trivy-report
          path: trivy-report.json
          retention-days: 30

      - name: Generowanie SBOM (Syft CycloneDX)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$(pwd)":/work -w /work \
            anchore/syft:latest \
            packages docker:badges-system:${{ github.sha }} \
            -o cyclonedx-json=sbom.cdx.json

      - name: Weryfikacja SBOM - brak mcp w obrazie testowym
        run: |
          if grep -q '"name": "mcp"' sbom.cdx.json; then
            echo "❌ mcp znaleziono w SBOM obrazu testowego"
            exit 1
          fi
          echo "✅ mcp nie występuje w SBOM obrazu testowego"

      - name: Upload SBOM jako artefakt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 30

      - name: Sprawdź skrypty w obrazie testowym
        run: docker compose --env-file .env -f compose.yml -f compose.test.yml run --rm web ls -la /app/scripts/

      - name: Próba Generalna Środowiska (test-run.sh --full)
        run: ./scripts/test-run.sh --full --export-pg-dump -m "not e2e"

      - name: Zapisanie logów Dockera (zawsze)
        if: always()
        run: docker compose --env-file .env -f compose.yml -f compose.test.yml logs > integration-test-docker-logs.txt || true

      - name: Upload dump'a PostgreSQL jako artefakt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: postgis-dump
          path: postgis_dump.custom

      - name: Debug - sprawdź rozmiar dumpa
        if: always()
        run: |
          ls -la postgis_dump.custom 2>/dev/null || echo "PLIK NIE ISTNIEJE"
          du -sh postgis_dump.custom 2>/dev/null || echo "ROZMIAR: 0"

      - name: Upload logów Dockera jako artefakt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: integration-test-docker-logs
          path: integration-test-docker-logs.txt

      - name: Cleanup środowiska Docker (zawsze)
        if: always()
        run: docker compose --env-file .env -f compose.yml -f compose.test.yml down -v --remove-orphans || true

  e2e-tests:
    name: E2E / Playwright Tests
    needs: integration-tests
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: badges_system_e2e
    steps:
      - name: Pobieranie repozytorium
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Instalacja zależności systemowych (GDAL, GEOS, PROJ, PostgreSQL client, unzip)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gdal-bin \
            libgdal-dev \
            libgeos-dev \
            libproj-dev \
            postgresql-client \
            unzip

      - name: Pobieranie dump'a PostgreSQL z jobu integration-tests
        run: |
          echo "=== Pobieranie dump'a PostgreSQL przez API ==="
          ARTIFACT_ID=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/Marek1Marecki/badges_system/actions/runs/${{ github.run_id }}/artifacts" \
            | grep -B5 '"name": "postgis-dump"' | grep '"id":' | head -1 | sed 's/.*"id": *\([0-9]*\).*/\1/')
          if [ -z "$ARTIFACT_ID" ]; then
            echo "BŁĄD: Nie znaleziono artifact 'postgis-dump'"
            exit 1
          fi
          echo "Znaleziono artifact ID: $ARTIFACT_ID"
          curl -L -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/Marek1Marecki/badges_system/actions/artifacts/$ARTIFACT_ID/zip" \
            -o /tmp/postgis-dump.zip
          sudo rm -rf /tmp/postgis-dump
          mkdir -p /tmp/postgis-dump
          unzip -q -o /tmp/postgis-dump.zip -d /tmp/postgis-dump
          ls -la /tmp/postgis-dump/

      - name: Sprawdzenie dump'a PostgreSQL
        run: |
          echo "=== Sprawdzenie dump'a PostgreSQL ==="
          ls -la /tmp/postgis-dump/
          du -sh /tmp/postgis-dump/postgis_dump.custom 2>/dev/null || echo "Dump nie istnieje!"
          if [ ! -f /tmp/postgis-dump/postgis_dump.custom ]; then
            echo "BŁĄD: Brak pliku postgis_dump.custom!"
            exit 1
          fi
          echo "✅ Dump istnieje: $(ls -lh /tmp/postgis-dump/postgis_dump.custom)"

      - name: Konfiguracja narzędzia UV
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.5.11"
          enable-cache: true

      - name: Konfiguracja Pythona 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"

      - name: Instalacja zależności (z grupy DEV)
        run: uv sync --frozen --group dev --python 3.14

      - name: Generowanie testowych środowisk i kluczy asymetrycznych
        run: |
          cp .env.example .env
          echo "DEV_UID=1000" >> .env
          echo "DEV_GID=1000" >> .env
          echo "POSTGRES_USER=postgres" >> .env
          echo "POSTGRES_PASSWORD=password" >> .env
          echo "POSTGRES_HOST=db" >> .env
          echo "IMAGE_NAME=badges-system" >> .env
          echo "IMAGE_TAG=${{ github.sha }}" >> .env
          cp .env.example .env.test
          echo "DJANGO_SECRET_KEY=$(openssl rand -hex 32)" >> .env.test
          echo "DJANGO_DEBUG=False" >> .env.test
          echo "POSTGRES_HOST=db" >> .env.test
          echo "LOG_LEVEL=DEBUG" >> .env.test

      - name: Uruchomienie infrastruktury i serwera Django
        run: |
          docker compose --env-file .env -f compose.yml -f compose.test.yml -f compose.e2e.yml down -v --remove-orphans || true
          docker compose --env-file .env -f compose.yml -f compose.test.yml -f compose.e2e.yml up -d --wait db redis web-e2e
          sleep 5
          docker compose --env-file .env -f compose.yml -f compose.test.yml -f compose.e2e.yml exec -T db mkdir -p /dumps
          docker compose --env-file .env -f compose.yml -f compose.test.yml -f compose.e2e.yml cp /tmp/postgis-dump/postgis_dump.custom db:/dumps/postgis_dump.custom
          echo "=== Sprawdzenie dump'a w kontenerze ==="
          docker compose --env-file .env -f compose.yml -f compose.test.yml -f compose.e2e.yml exec -T db ls -lh /dumps/
          echo "=== Przygotowanie czystej bazy danych ==="
          docker compose --env-file .env -f compose.yml -f compose.test.yml -f compose.e2e.yml exec -T db psql -U postgres -c "DROP DATABASE IF EXISTS badges_system_db;"
          docker compose --env-file .env -f compose.yml -f compose.test.yml -f compose.e2e.yml exec -T db psql -U postgres -c "CREATE DATABASE badges_system_db OWNER postgres;"
          echo "=== Wykonywanie pg_restore na czystej bazie ==="
          docker compose --env-file .env -f compose.yml -f compose.test.yml -f compose.e2e.yml exec -T db bash -c "pg_restore -U postgres -d badges_system_db --no-owner --verbose -1 /dumps/postgis_dump.custom 2>&1 | tee /tmp/restore.log"
          echo "=== Sprawdzenie danych po restore ==="
          docker compose --env-file .env -f compose.yml -f compose.test.yml -f compose.e2e.yml exec -T db psql -U postgres -d badges_system_db -c "SELECT count(*) FROM odznaki_badge; SELECT count(*) FROM odznaki_tourist_object; SELECT count(*) FROM auth_user;"
          docker compose --env-file .env -f compose.yml -f compose.test.yml -f compose.e2e.yml exec -T web-e2e python manage.py shell -c "from django.contrib.auth import get_user_model; User = get_user_model(); user, _ = User.objects.get_or_create(username='admin', defaults={'email': 'admin@example.com', 'is_staff': True, 'is_superuser': True}); user.set_password('admin'); user.save(); print('Admin user ready')"

      - name: Uruchomienie testów e2e
        run: docker compose --env-file .env -f compose.yml -f compose.test.yml -f compose.e2e.yml exec -T web-e2e uv run pytest tests/e2e -m e2e --no-header -q --override-ini="addopts="

      - name: Zapisanie logów Dockera (zawsze)
        if: always()
        run: docker compose --env-file .env -f compose.yml -f compose.test.yml -f compose.e2e.yml logs > e2e-docker-logs.txt || true

      - name: Upload logów Dockera jako artefakt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: e2e-docker-logs
          path: e2e-docker-logs.txt

      - name: Cleanup środowiska Docker (zawsze)
        if: always()
        run: docker compose --env-file .env -f compose.yml -f compose.test.yml -f compose.e2e.yml down -v --remove-orphans || true
