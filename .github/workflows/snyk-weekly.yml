name: Snyk Weekly Security Scan

# Uruchamiamy w każdy poniedziałek o 3:00 UTC.
# Pozwalamy też na ręczne odpalenie (workflow_dispatch) na wypadek testów.
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  snyk-scan:
    name: Opcjonalny Skan Bezpieczeństwa Zależności
    runs-on: ubuntu-latest

    steps:
      - name: Pobieranie repozytorium
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Konfiguracja narzędzia UV
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.3"
          enable-cache: true

      - name: Instalacja Snyk CLI (przypięta wersja + checksum)
        run: |
          curl -fsSL https://downloads.snyk.io/cli/v1.1306.3/snyk-linux -o /tmp/snyk-linux
          curl -fsSL https://downloads.snyk.io/cli/v1.1306.3/snyk-linux.sha256 -o /tmp/snyk-linux.sha256
          cd /tmp
          sha256sum -c snyk-linux.sha256
          mv snyk-linux /usr/local/bin/snyk
          chmod +x /usr/local/bin/snyk
          snyk version

      - name: Skanowanie Snyk Open Source
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --severity-threshold=high --file=pyproject.toml --no-root --json-file-output=snyk-results.json || true

      - name: Upload wyników Snyk jako artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: snyk-results
          path: snyk-results.json
          retention-days: 30
