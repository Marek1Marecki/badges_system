name: Snyk Weekly Security Scan

# Uruchamiamy w każdy poniedziałek o 3:00 UTC.
# Pozwalamy też na ręczne odpalenie (workflow_dispatch) na wypadek testów.
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  snyk-scan:
    name: Opcjonalny Skan Bezpieczeństwa Zależności
    runs-on: ubuntu-latest

    steps:
      - name: Pobieranie repozytorium
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Konfiguracja narzędzia UV
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.3"
          enable-cache: true

      - name: Zrzut zależności z 'uv' do standardowego formatu (dla Snyka)
        run: uv pip compile pyproject.toml -o requirements.txt

      - name: Instalacja Snyk CLI
        run: |
          curl -sSL https://downloads.snyk.io/cli/latest/snyk-linux -o /usr/local/bin/snyk
          chmod +x /usr/local/bin/snyk
          snyk version

      - name: Skanowanie Snyk Open Source
        # Snyk NIE BLOKUJE pipeline. To tylko monitoring.
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          uv venv .snyk-venv
          uv pip install --python .snyk-venv/bin/python -r requirements.txt
          snyk test --severity-threshold=high --file=requirements.txt --no-root --python=.snyk-venv/bin/python --python=.snyk-venv/bin/python --python=.snyk-venv/bin/python --python=.snyk-venv/bin/python --python=.snyk-venv/bin/python --python=.snyk-venv/bin/python --python=.snyk-venv/bin/python --python=.snyk-venv/bin/python --python=.snyk-venv/bin/python
