name: PROD Daily Backup

on:
  schedule:
    # Codziennie o 02:00 UTC (+00:00)
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force backup even if conditions are not met'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read
  id-token: write  # OIDC dla bezpiecznej autentykacji do S3

jobs:
  backup-prod:
    name: Backup bazy danych PROD
    runs-on: ubuntu-latest

    # Ochrona przed przypadkowym uruchomieniem w weekendy
    if: (github.event_name == 'workflow_dispatch' && inputs.force == 'true') || github.event_name == 'schedule'

    steps:
      - name: Checkout repozytorium
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Konfiguracja Pythona
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version-file: .python-version

      - name: Instalacja uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff  # v6
        with:
          version: '0.12.3'

      # --- Krok 1: Autentykacja OIDC do chmury (bez stałych sekretów) ---
      - name: Konfiguracja dostępu do S3 (OIDC)
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c  # v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/backup-writer-prod
          aws-region: eu-central-1
          mask-password: 'yes'

      # --- Krok 2: Zrzut bazy PROD przez Docker ---
      # Uwaga: workflow działa na GitHub-hosted runnerze, łączy się przez
      # SSH do serwera PROD i uruchamia pg_dump WEWNĄTRZ kontenera db,
      # aby wersja klienta zawsze pasowała do serwera (ADR-021).
      - name: Zrzut bazy danych (pg_dump -Fc)
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          BACKUP_FILE="badges_prod_${TIMESTAMP}.dump"

          mkdir -p ./tmp-backup

          # SSH do serwera PROD → uruchom pg_dump w kontenerze → strumień do pliku
          # Używamy -T (bez alloc TTY) dla stabilności w SSH.
          ssh -o StrictHostKeyChecking=accept-new \
            -i ~/.ssh/prod-deploy \
            "${{ secrets.PROD_HOST }}" \
            "docker compose -f /app/compose.prod.yml exec -T db pg_dump -U postgres -Fc badges_system_db" \
            > "./tmp-backup/${BACKUP_FILE}"

          echo "BACKUP_FILE=${BACKUP_FILE}" >> "$GITHUB_ENV"
          echo "Backup size: $(du -h tmp-backup/${BACKUP_FILE} | cut -f1)"

      # --- Krok 3: Upload do S3 (Write-Only) ---
      - name: Upload do S3
        run: |
          # Konto backup-writer-prod ma tylko PUT Object — bez GET/DELETE
          aws s3 cp "./tmp-backup/${{ env.BACKUP_FILE }}" \
            "s3://${{ secrets.S3_BUCKET_PROD }}/backups/${{ env.BACKUP_FILE }}" \
            --storage-class STANDARD_IA

      # --- Krok 4: Powiadomienie o sukcesie ---
      - name: Powiadomienie Slack (opcjonalne)
        if: always()
        uses: 8398a7/action-slack@047b09b154480ed39076984b64f324fff010d703  # v3.9.3
        with:
          status: ${{ job.status }}
          text: "🔄 Backup PROD: `${{ env.BACKUP_FILE }}` — Status: ${{ job.status }}"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_BACKUP }}

