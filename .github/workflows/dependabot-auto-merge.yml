name: Dependabot Auto-merge

on:
  pull_request_target:
    types: [opened, synchronize, ready_for_review, reopened]
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "30 */6 * * *" # every 6 hours

permissions:
  contents: write
  pull-requests: write
  statuses: read

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: >
      github.actor == 'dependabot[bot]'

    steps:
      - name: Merge Dependabot PRs when CI is green
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            const { owner, repo } = context.repo;

            let prs = [];
            if (context.eventName === 'pull_request_target') {
              const pr = context.payload.pull_request;
              if (pr.user.type !== 'Bot' || pr.user.login !== 'dependabot[bot]') {
                console.log('Not a Dependabot PR, skipping.');
                return;
              }
              prs = [{ number: pr.number, sha: pr.head.sha }];
            } else {
              const all = await github.paginate(github.rest.pulls.list, {
                owner, repo, state: 'open', sort: 'updated',
              });
              prs = all.filter(p => p.user.type === 'Bot' && p.user.login === 'dependabot[bot]');
            }

            if (prs.length === 0) {
              console.log('No open Dependabot PRs to evaluate.');
              return;
            }

            for (const pr of prs) {
              if (!pr.head || !pr.head.sha) {
                console.log(`PR #${pr.number}: no head SHA, skipping.`);
                continue;
              }

              console.log(`Evaluating PR #${pr.number} (${pr.head.sha})`);

              let merged = false;
              for (let attempt = 0; attempt < 20; attempt++) {
                const checkRuns = await github.paginate(
                  github.rest.repos.listCheckRunsForRef,
                  { owner, repo, ref: pr.head.sha },
                );

                const relevant = checkRuns.filter(c =>
                  c.name.includes('Gate') ||
                  c.name.includes('Diagnostic') ||
                  c.name.includes('CodeQL'),
                );

                const incomplete = relevant.filter(c => c.status !== 'completed');
                if (incomplete.length > 0) {
                  console.log(`  PR #${pr.number}: waiting (${incomplete.length} incomplete): ${incomplete.map(c => `${c.name}:${c.status}`).join(', ')}`);
                  await new Promise(r => setTimeout(r, 30000));
                  continue;
                }

                const failed = relevant.filter(c => c.conclusion !== 'success');
                if (failed.length > 0) {
                  console.log(`  PR #${pr.number}: checks not successful: ${failed.map(c => `${c.conclusion} ${c.name}`).join(', ')}`);
                  break;
                }

                await github.rest.pulls.merge({
                  owner, repo, pull_number: pr.number,
                  merge_method: 'squash',
                  commit_title: pr.title,
                  commit_message: 'Auto-merged by Dependabot Auto-merge workflow after green CI Gate (Diagnostic + CodeQL).',
                });
                console.log(`  Merged PR #${pr.number}.`);
                merged = true;
                break;
              }

              if (!merged) {
                console.log(`  Did not merge PR #${pr.number}: CI did not pass within timeout.`);
              }
            }
