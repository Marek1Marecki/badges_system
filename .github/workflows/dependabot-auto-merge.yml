name: Dependabot Auto-merge

on:
  pull_request_target:
    types: [opened, synchronize, ready_for_review, reopened]
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "30 */6 * * *" # every 6 hours

permissions:
  contents: write
  pull-requests: write
  statuses: read

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Auto-merge Dependabot PRs
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            const { owner, repo } = context.repo;

            let prs = [];
            if (context.eventName === 'pull_request_target') {
              const pr = context.payload.pull_request;
              if (pr.user.type !== 'Bot' || pr.user.login !== 'dependabot[bot]') {
                console.log('Not a Dependabot PR, skipping.');
                return;
              }
              prs = [{ number: pr.number, sha: pr.head.sha }];
            } else {
              const all = await github.paginate(github.rest.pulls.list, {
                owner, repo, state: 'open', sort: 'updated',
              });
              prs = all.filter(p => p.user.type === 'Bot' && p.user.login === 'dependabot[bot]');
            }

            if (prs.length === 0) {
              console.log('No open Dependabot PRs to evaluate.');
              return;
            }

            for (const pr of prs) {
              const { data: combined } = await github.rest.repos.getCombinedStatusForRef({
                owner, repo, ref: pr.sha,
              });

              const gateContexts = combined.statuses.filter(s =>
                s.context.includes('Gate') || s.context.includes('Diagnostic') || s.context.includes('CodeQL')
              );
              const gateAllSuccess = gateContexts.every(s => s.state === 'success');

              if (gateContexts.length === 0) {
                console.log(`PR #${pr.number} (${pr.sha}): no Gate/Diagnostic/CodeQL contexts found, skipping.`);
                continue;
              }
              if (!gateAllSuccess) {
                console.log(`PR #${pr.number} (${pr.sha}): Gate not green (combined state=${combined.state}), skipping.`);
                for (const sc of gateContexts) {
                  console.log(`  ${sc.context}: ${sc.state}`);
                }
                continue;
              }

              console.log(`PR #${pr.number} (${pr.sha}): Gate green, checking if already merged or behind base.`);
              try {
                const { data: fresh } = await github.rest.pulls.get({ owner, repo, pull_number: pr.number });
                if (fresh.mergeable_state === 'dirty' || fresh.mergeable_state === 'behind') {
                  console.log(`PR #${pr.number}: not mergeable (mergeable_state=${fresh.mergeable_state}), skipping.`);
                  continue;
                }
              } catch (e) {
                console.log(`PR #${pr.number}: could not re-check mergeability, proceeding: ${e.message}`);
              }

              await github.rest.pulls.merge({
                owner, repo, pull_number: pr.number,
                merge_method: 'squash',
                commit_title: `chore(deps): auto-merge Dependabot PR #${pr.number}`,
                commit_message: 'Auto-merged by Dependabot Auto-merge workflow after green CI Gate (Diagnostic + CodeQL).',
              });
              console.log(`Merged PR #${pr.number}.`);
            }
