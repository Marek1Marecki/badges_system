name: Dependabot Auto-merge

on:
  pull_request_target:
    types: [opened, synchronize, ready_for_review, reopened]
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "30 */6 * * *" # every 6 hours

permissions:
  contents: write
  pull-requests: write
  statuses: read
  checks: read

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: >
      github.event_name != 'pull_request_target'
      || github.actor == 'dependabot[bot]'
    timeout-minutes: 180

    steps:
      - name: Merge Dependabot PRs when CI is green
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            const { owner, repo } = context.repo;

            let prs = [];
            if (context.eventName === 'pull_request_target') {
              const pr = context.payload.pull_request;
              if (pr.user.type !== 'Bot' || pr.user.login !== 'dependabot[bot]') {
                console.log('Not a Dependabot PR, skipping.');
                return;
              }
              prs = [{ number: pr.number }];
            } else {
                const all = await github.paginate(github.rest.pulls.list, {
                owner, repo, state: 'open', sort: 'updated',
              });
              prs = all.filter(p => p.user.type === 'Bot' && p.user.login === 'dependabot[bot]');
            }

            if (prs.length === 0) {
              console.log('No open Dependabot PRs to evaluate.');
              return;
            }

            for (const pr of prs) {
              let merged = false;

              for (let attempt = 0; attempt < 40; attempt++) {
                const { data: p } = await github.rest.pulls.get({
                  owner, repo, pull_number: pr.number,
                });

                if (!p.head || !p.head.sha) {
                  console.log(`PR #${pr.number}: no head SHA, skipping.`);
                  break;
                }

                const { data: files } = await github.rest.pulls.listFiles({
                  owner, repo, pull_number: pr.number, per_page: 100,
                });
                if (files.some(f => f.filename.startsWith('.github/workflows/'))) {
                  console.log(`  PR #${pr.number}: modifies .github/workflows/, skipping (requires workflows:write permission; merge manually).`);
                  continue;
                }

                const checkData = await github.request(
                  'GET /repos/{owner}/{repo}/commits/{ref}/check-runs',
                  { owner, repo, ref: p.head.sha },
                );
                const checkRuns = checkData.check_runs ?? [];

                const relevant = checkRuns.filter(c => {
                  if (!c.name) return false;
                  return c.name.includes('Gate') || c.name.includes('Diagnostic') || c.name.includes('CodeQL');
                });

                const incomplete = relevant.filter(c => c.status !== 'completed');
                if (incomplete.length > 0) {
                  if (attempt === 0) {
                    console.log(`  PR #${pr.number}: waiting on ${incomplete.length} check(s): ${incomplete.map(c => `${c.name}:${c.status}`).join(', ')}`);
                  }
                  await new Promise(r => setTimeout(r, 45000));
                  continue;
                }

                const failed = relevant.filter(c => c.conclusion !== 'success');
                if (failed.length > 0) {
                  console.log(`  PR #${pr.number}: checks not successful: ${failed.map(c => `${c.conclusion} ${c.name}`).join(', ')}`);
                  break;
                }

                if (p.mergeable_state === 'dirty' || p.mergeable_state === 'blocked') {
                  console.log(`  PR #${pr.number}: mergeable_state=${p.mergeable_state}, skipping.`);
                  break;
                }

                if (p.mergeable_state === 'behind') {
                  console.log(`  PR #${pr.number}: behind base (${p.mergeable_state}), requesting update_branch...`);
                  try {
                    await github.rest.pulls.updateBranch({ owner, repo, pull_number: pr.number });
                    console.log(`  PR #${pr.number}: update_branch requested, waiting for new check suite...`);
                  } catch (e) {
                    console.log(`  PR #${pr.number}: updateBranch error: ${e.message}`);
                  }
                  await new Promise(r => setTimeout(r, 60000));
                  continue;
                }

                // mergeable_state is clean / unstable / unknown
                try {
                  await github.rest.pulls.merge({
                    owner, repo, pull_number: pr.number,
                    merge_method: 'squash',
                    commit_title: p.title,
                    commit_message: 'Auto-merged by Dependabot Auto-merge workflow after green CI Gate (Diagnostic + CodeQL).',
                  });
                  console.log(`  Merged PR #${pr.number}.`);
                  merged = true;
                  break;
                } catch (e) {
                  console.log(`  PR #${pr.number}: merge error (status ${e.status}): ${e.message}`);
                  if (e.status === 409) {
                    console.log(`  PR #${pr.number}: still not mergeable, retrying...`);
                    await new Promise(r => setTimeout(r, 30000));
                    continue;
                  }
                  break;
                }
              }

              if (!merged) {
                console.log(`  Did not merge PR #${pr.number} this run.`);
              }
            }
